name: Atualizacao de banco de dados imobiliarios

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write  # abrir (e fechar) a issue de aviso quando a coleta quebra

# Evita duas execuções simultâneas brigando pelo push do CSV
concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar_csv:
    # Versão fixa: o ubuntu-latest passa a ser o Ubuntu 26 a partir de 19/10/2026
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7

      # O histórico (um Parquet por dia) fica no branch `data`, separado do código
      - name: Checkout do histórico (branch data)
        uses: actions/checkout@v7
        with:
          ref: data
          path: historico-data

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-scraper.txt

      # Os `id` dos passos aparecem no aviso de falha (scraper/alertas.py diz qual etapa quebrou)
      - name: Instalar dependências do scraper
        id: dependencias
        run: pip install -r requirements-scraper.txt

      # Cada download já tenta de novo sozinho; estas tentativas cobrem o
      # site fora do ar por alguns minutos. O scraper sai com erro (e não
      # grava o CSV) se o resultado parecer quebrado.
      # O tee guarda a saída em coleta.log (o fim dele vai no aviso de falha).
      # Com `shell: bash`, o Actions liga o pipefail: o resultado de
      # "python | tee" é o do python, e não o do tee (que nunca falha).
      - name: Rodar o scraper
        id: scraper
        shell: bash
        run: |
          for tentativa in 1 2 3; do
            echo "::group::Tentativa $tentativa"
            if timeout 15m python -m scraper 2>&1 | tee -a coleta.log; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::Tentativa $tentativa do scraper falhou"
            sleep 300
          done
          echo "::error::Scraper falhou nas 3 tentativas"
          exit 1

      - name: Commit e push do CSV atualizado
        id: csv
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add dados/imoveis.csv
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados"
            exit 0
          fi
          git commit -m "Atualização de dados automática"
          git pull --rebase origin main
          git push origin main

      - name: Guardar snapshot do dia no histórico
        id: snapshot
        run: |
          arquivo=$(python -m historico.snapshot dados/imoveis.csv --destino historico-data/snapshots)
          cd historico-data
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add snapshots
          if git diff --cached --quiet; then
            echo "Snapshot igual ao já guardado"
            exit 0
          fi
          git commit -m "Snapshot $(basename "$arquivo" .parquet)"
          git pull --rebase origin data
          git push origin data

      # O HTML das páginas que o scraper não conseguiu ler fica 14 dias na página da
      # execução, para investigar (e virar fixture de teste com tests/salvar_fixture.py)
      - name: Guardar as páginas com falha
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paginas-com-falha
          path: falhas/
          if-no-files-found: ignore
          retention-days: 14

      # Os avisos usam python3 e só a biblioteca padrão: funcionam mesmo se a
      # instalação do Python ou das dependências for o que falhou
      - name: Avisar que a coleta quebrou
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PASSOS: ${{ toJSON(steps) }}
        run: python3 -m scraper.alertas falhou --log coleta.log

      - name: Fechar o aviso de coleta quebrada
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m scraper.alertas resolvida
