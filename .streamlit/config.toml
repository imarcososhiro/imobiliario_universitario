# Tema do dashboard: claro e leve, que combina com as fotos dos imóveis e com o mapa.
# A cor principal (índigo) aparece nos botões, filtros e no campus escolhido no mapa.
# Os cartões e a lista de bairros são HTML próprio, com o estilo em app/interface.py.

[theme]
base = "light"
primaryColor = "#4f46e5"
backgroundColor = "#f7f7fb"
secondaryBackgroundColor = "#eef0f6"
textColor = "#171a26"
linkColor = "#4f46e5"
borderColor = "#e3e6ef"
showWidgetBorder = true
baseRadius = "large"
buttonRadius = "full"
dataframeHeaderBackgroundColor = "#eef0f6"

# Texto em Plus Jakarta Sans e títulos em Bricolage Grotesque: duas fontes modernas e amigáveis
font = "'Plus Jakarta Sans':https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap"
headingFont = "'Bricolage Grotesque':https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap"
headingFontWeights = [800, 700, 700, 600, 600, 600]
headingFontSizes = ["2.6rem", "1.6rem", "1.2rem"]
baseFontSize = 15

[client]
toolbarMode = "minimal"  # esconde o menu de desenvolvedor para quem só quer achar um apê
